<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Torn Coach</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0e1013; --panel: #171a1f; --line: #262b33;
    --text: #e6e8ea; --muted: #8b939e;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --accent: #60a5fa;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 20px 16px 60px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 19px; margin: 0; font-weight: 650; }
  .muted { color: var(--muted); font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; margin-bottom: 14px; }
  .bar-row { margin-bottom: 14px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-head { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 6px; }
  .bar-name { text-transform: capitalize; font-weight: 600; }
  .track { height: 10px; border-radius: 999px; background: #0b0d10; overflow: hidden; }
  .fill { height: 100%; border-radius: 999px; transition: width .4s ease; }
  .fill.ok { background: var(--ok); } .fill.warn { background: var(--warn); } .fill.full { background: var(--bad); }
  .next { border-left: 3px solid var(--accent); padding-left: 12px; }
  .next h2 { font-size: 15px; margin: 0 0 4px; }
  ul { margin: 8px 0 0; padding-left: 18px; }
  li { margin-bottom: 4px; font-size: 14px; }
  .blocker { color: var(--bad); font-weight: 600; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Torn Coach</h1>
    <span class="muted" id="updated">chargement…</span>
  </header>
  <div id="root"><div class="panel muted">Connexion à l’API Torn…</div></div>
</main>

<script>
const fmt = (s) => {
  if (s == null || s < 0) return '?';
  s = Math.floor(s);
  if (s < 60) return s + 's';
  const m = Math.floor(s / 60);
  if (m < 60) return m + 'm';
  return Math.floor(m / 60) + 'h' + (m % 60 ? ' ' + (m % 60) + 'm' : '');
};
const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

function barRow(bar) {
  const pct = Math.min(100, Math.round(bar.ratio * 100));
  const cls = bar.isFull ? 'full' : bar.ratio >= 0.9 ? 'warn' : 'ok';
  const right = bar.isFull ? 'PLEINE — régen perdue' : 'pleine dans ' + fmt(bar.fullIn);
  return `<div class="bar-row">
    <div class="bar-head"><span class="bar-name">${esc(bar.name)}</span>
      <span class="muted">${bar.current}/${bar.maximum} · ${esc(right)}</span></div>
    <div class="track"><div class="fill ${cls}" style="width:${pct}%"></div></div>
  </div>`;
}

function render(data) {
  const { snapshot, advice, next, blockers } = data;
  const bars = ['energy', 'nerve', 'happy', 'life']
    .map((n) => snapshot.bars[n]).filter(Boolean).map(barRow).join('');

  const blockersHtml = blockers.length
    ? `<div class="panel">${blockers.map((b) =>
        `<div class="blocker">${esc(b.title)} <span class="muted">(${fmt(b.seconds)})</span></div>`).join('')}</div>`
    : '';

  const nextHtml = next
    ? `<div class="panel next"><h2>${esc(next.title)}</h2><div class="muted">${esc(next.detail || '')}</div></div>`
    : `<div class="panel muted">Rien d’urgent — les barres se rechargent.</div>`;

  const rest = (next ? advice.slice(1) : advice);
  const restHtml = rest.length
    ? `<div class="panel"><div class="muted">Ensuite</div><ul>${
        rest.map((a) => `<li>${esc(a.title)}</li>`).join('')}</ul></div>`
    : '';

  document.getElementById('root').innerHTML =
    `<div class="panel"><div class="muted" style="margin-bottom:12px">
       ${esc(snapshot.player.name || 'Joueur')} — niveau ${esc(snapshot.player.level ?? '?')}
     </div>${bars}</div>` + blockersHtml + nextHtml + restHtml;

  document.getElementById('updated').textContent =
    'maj ' + new Date(snapshot.fetchedAt).toLocaleTimeString();
}

async function tick() {
  try {
    const res = await fetch('api/status');
    const data = await res.json();
    if (data.error) throw new Error(data.error);
    render(data);
  } catch (err) {
    document.getElementById('root').innerHTML =
      `<div class="panel err">${esc(err.message)}</div>`;
    document.getElementById('updated').textContent = 'erreur';
  }
}

tick();
setInterval(tick, 30000);
</script>
</body>
</html>
